services:
  gva24:
    build: .
    container_name: gva24
    restart: unless-stopped
    ports:
      - "5174:8787" # hôte:conteneur — l'app est accessible sur le port 5174
    volumes:
      - ./data:/data # la base de données (fichiers JSON) survit aux redémarrages
    environment:
      - RACE_PIN=2424 # code de la course créée automatiquement au premier démarrage
